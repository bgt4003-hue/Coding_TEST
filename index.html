<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>브라우저 테트리스</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-layout">
      <section class="playfield card">
        <h1>🎮 Tetris</h1>
        <canvas id="board" width="300" height="600" aria-label="테트리스 보드"></canvas>
      </section>

      <aside class="panel card">
        <div class="stat-box">
          <h2>점수</h2>
          <p id="score">0</p>
        </div>
        <div class="stat-box">
          <h2>라인</h2>
          <p id="lines">0</p>
        </div>
        <div class="stat-box">
          <h2>레벨</h2>
          <p id="level">1</p>
        </div>

        <div class="next-wrapper">
          <h2>다음 블록</h2>
          <canvas id="next" width="120" height="120" aria-label="다음 블록"></canvas>
        </div>

        <div class="controls">
          <h2>조작법</h2>
          <ul>
            <li>⬅️ / ➡️ : 좌우 이동</li>
            <li>⬇️ : 빠르게 내리기</li>
            <li>⬆️ / X : 회전</li>
            <li>Z : 반대 회전</li>
            <li>Space : 하드 드롭</li>
            <li>P : 일시정지</li>
          </ul>
        </div>

        <button id="startBtn" class="btn">게임 시작 / 재시작</button>
        <p id="status" class="status">시작 버튼을 눌러 게임을 시작하세요.</p>
      </aside>
    </main>

    <script src="script.js"></script>
  </body>
</html>
